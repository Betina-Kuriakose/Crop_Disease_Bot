<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CropAdvisor - Advising For Crop Cultivation Using ML</title>
  <style>
    /* Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100%;
      background: #fff;
      color: #2f4f1f;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Container max width */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .logo-svg {
      width: 36px;
      height: 36px;
      fill: #4a7c0c;
    }

    .site-title {
      font-weight: 700;
      font-size: 1.6rem;
      color: #4a7c0c;
      user-select: none;
    }

    ul.nav-menu {
      list-style: none;
      display: flex;
      gap: 2rem;
      font-weight: 600;
      font-size: 1rem;
      text-transform: uppercase;
      align-items: center;
    }

    ul.nav-menu li a:hover {
      color: #7fb800;
    }

    /* Hero */
    .hero {
      position: relative;
      height: 65vh;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.6)),
        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80');
      background-size: cover;
      background-position: center center;
      color: white;
      display: flex;
      align-items: center;
      padding-left: 5%;
    }

    .hero-text {
      max-width: 600px;
    }

    .hero-text h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 1.8rem;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
      white-space: pre-line;
    }

    .btn-group {
      display: flex;
      gap: 1.25rem;
    }

    .btn {
      background-color: #7fb800;
      border: none;
      color: white;
      font-weight: 700;
      padding: 1rem 2rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease;
      text-transform: uppercase;
      box-shadow: 0 5px 15px rgba(127,184,0,0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: #a8d300;
    }

    .btn svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero {
        height: 50vh;
        padding-left: 3%;
        display: flex;
        justify-content: center;
        text-align: center;
      }

      .hero-text {
        max-width: 100%;
      }

      .btn-group {
        justify-content: center;
      }

      .btn {
        width: 180px;
        justify-content: center;
      }

      ul.nav-menu {
        gap: 1rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <div class="logo-container" aria-label="CropAdvisor logo and title" tabindex="0" onclick="window.location.href='/'">
        <!-- Example of simple wheat logo -->
        <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false" role="img">
          <g>
            <path d="M18 52V28l7 3 5 16 4-24 5 13 5-13 7 4v24H18z" />
            <rect x="4" y="50" width="56" height="6" fill="#4a7c0c"/>
          </g>
        </svg>
        <div class="site-title">CropAdvisor</div>
      </div>
      <ul class="nav-menu" role="menubar">
        <li><a href="/" role="menuitem" tabindex="0">Home</a></li>
        <li><a href="#" role="menuitem" tabindex="0">About Us</a></li>
        <li><a href="#" role="menuitem" tabindex="0">Contact</a></li>
        <li><a href="/login" role="menuitem" tabindex="0">Login / Signup</a></li>
      </ul>
    </nav>
  </div>

  <section class="hero" role="banner" aria-label="Advising for crop cultivation using machine learning">
    <div class="hero-text container">
      <h1>Advising For Crop Cultivation Using Machine Learning</h1>
      <div class="btn-group">
        <button type="button" class="btn" aria-label="Open Chatbot" onclick="navigateToChat()">
          <!-- Chatbot icon SVG -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false" role="img">
            <path d="M12 2a7 7 0 00-7 7v1H4a1 1 0 00-1 1v5a2 2 0 002 2h2l-1 3v1h10v-1l-1-3h2a2 2 0 002-2v-5a1 1 0 00-1-1h-1V9a7 7 0 00-7-7zm-3 7a1 1 0 112 0 1 1 0 01-2 0zm6 0a1 1 0 112 0 1 1 0 01-2 0z"/>
          </svg>
          Chatbot
        </button>
      </div>
    </div>
  </section>

  <script>
    function navigateToChat() {
      window.location.href = '/chat';
    }
  </script>
</body>
</html>
