<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CropAdvisor Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top left, #22c55e 0, transparent 55%),
        radial-gradient(circle at bottom right, #0ea5e9 0, transparent 55%),
        #020617;
      color: #0f172a;
      padding: 16px;
    }

    .card {
      background: #f9fafb;
      width: min(420px, 100%);
      border-radius: 22px;
      padding: 2.3rem 2.5rem;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      border: 1px solid rgba(148, 163, 184, 0.6);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.6rem;
      color: #022c22;
    }

    p {
      margin-bottom: 1.4rem;
      color: #4b5563;
      font-size: 0.95rem;
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 600;
      color: #111827;
      font-size: 0.9rem;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.8rem 1rem;
      margin-bottom: 1rem;
      border-radius: 999px;
      border: 1px solid #cbd5f5;
      background: #eef2ff;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 1px rgba(79, 70, 229, 0.3);
    }

    button {
      width: 100%;
      padding: 0.9rem 1rem;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.98rem;
      box-shadow: 0 15px 35px rgba(22, 163, 74, 0.5);
    }

    button:hover {
      opacity: 0.96;
    }

    .error {
      background: #fee2e2;
      color: #b91c1c;
      padding: 0.75rem 1rem;
      border-radius: 14px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      border: 1px solid #fecaca;
    }

    .cta {
      margin-top: 1.3rem;
      text-align: center;
      font-size: 0.9rem;
      color: #4b5563;
    }

    .cta a {
      color: #4f46e5;
      font-weight: 600;
      text-decoration: none;
    }

    .cta a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card" role="form" aria-label="Login form">
    <h1>Welcome back 👋</h1>
    <p>Sign in to access the CropAdvisor chatbot.</p>

    {% if error %}
      <div class="error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit">Login</button>
    </form>

    <div class="cta">
      <p>Don't have an account? <a href="{{ url_for('signup') }}">Sign up here</a></p>
      <p style="margin-top:0.4rem;"><a href="{{ url_for('index') }}">← Back to home</a></p>
    </div>
  </div>
</body>
</html>
