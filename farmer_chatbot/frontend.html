<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CropAdvisor - Advise for Crop Cultivation</title>
  <style>
    /* Reset & base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100%;
      background: #fff;
      color: #2f4f1f;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Navigation Bar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 3rem;
      background: white;
      box-shadow: 0 2px 5px rgb(0 0 0 / 0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.4rem;
      color: #4a7c0c;
    }

    nav .logo svg {
      height: 32px;
      width: 32px;
      fill: #4a7c0c;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 2rem;
      font-weight: 600;
      font-size: 1rem;
    }

    nav ul li a:hover {
      color: #7fb800;
    }

    /* Hero Section */
    .hero {
      position: relative;
      height: 70vh;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0.6)),
        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80');
      background-size: cover;
      background-position: center center;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 5%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: clamp(2rem,4vw,3rem);
      font-weight: 900;
      max-width: 700px;
      margin-bottom: 1.5rem;
      line-height: 1.2;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
    }

    .hero .buttons {
      display: flex;
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .hero button {
      background-color: #7fb800;
      border: none;
      color: white;
      font-weight: 700;
      padding: 1rem 2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.1rem;
      text-transform: uppercase;
      box-shadow: 0 6px 10px rgba(127,184,0,0.6);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero button i {
      margin-right: 8px;
      font-size: 1.3rem;
    }

    .hero button:hover {
      background-color: #a8d300;
      box-shadow: 0 10px 20px rgba(168,211,0,0.8);
    }

    /* Responsive navigation for smaller screens */
    @media (max-width: 768px) {
      nav {
        padding: 0.75rem 1.5rem;
      }
      nav ul {
        gap: 1rem;
        font-size: 0.95rem;
      }
      .hero {
        height: 55vh;
        padding-left: 3%;
      }
      .hero h1 {
        font-size: clamp(1.5rem, 5vw, 2.5rem);
        max-width: 95%;
      }
      .hero .buttons {
        flex-direction: column;
        width: max-content;
      }
      .hero button {
        width: 150px;
        padding: 0.75rem 1rem;
        font-size: 1rem;
      }
    }
  </style>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

<body>
  <nav>
    <div class="logo" aria-label="CropAdvisor logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <path d="M10 54v-28l8 4 6 22 4-34 6 16 6-16 8 4v28h-38z"/>
      </svg>
      CropAdvisor
    </div>
    <ul role="menubar">
      <li role="none"><a href="#" role="menuitem" tabindex="0">Home</a></li>
      <li role="none"><a href="#" role="menuitem" tabindex="0">About Us</a></li>
      <li role="none"><a href="#" role="menuitem" tabindex="0">Contact</a></li>
      <li role="none"><a href="#" role="menuitem" tabindex="0">Login / Signup</a></li>
    </ul>
  </nav>

  <section class="hero" role="banner" aria-label="Crop cultivation machine learning prediction">
    <h1>Advising For Crop Cultivation Using Machine Learning</h1>
    <div class="buttons">
      <button type="button" aria-label="Open Chatbot" onclick="navigateToChat()">
        <i class="fas fa-robot"></i> Chatbot
      </button>
    </div>
  </section>

  <script>
    function navigateToChat() {
      window.location.href = '/chat';
    }
  </script>
</body>
</html>
